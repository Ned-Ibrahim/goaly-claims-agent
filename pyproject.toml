[project]
name = "claims-agent"
version = "0.1.0"
description = "SOP harness for an insurance claims support agent: code owns control, the LLM owns language."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
